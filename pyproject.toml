authors = [{name = "Turbolego", email = "turbolego@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
keywords = ["bsky", "bluesky", "atproto", "bot", "python", "books", "ai", "gpt4o"]
requires-python = ">=3.10"
dependencies = [
