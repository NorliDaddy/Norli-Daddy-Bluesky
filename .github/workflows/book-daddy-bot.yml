name: Norli Book Daddy Bot

on:
  schedule:
    # Run daily at 10:00 AM UTC (11:00 AM CET, 12:00 PM CEST)
    - cron: '0 10 * * *'
  workflow_dispatch:  # Allow manual triggers

jobs:
  post-book-review:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install Python dependencies
        run: |
          uv pip install --system -e .

      - name: Install GitHub Copilot CLI
        run: |
          npm install -g @github/copilot
          copilot --version

      - name: Run Norli Book Daddy Bot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
        run: |
          python src/main.py

      - name: Commit and push state file
        run: |
          git config --global user.name "Book Daddy Bot"
          git config --global user.email "bot@bookdaddy.com"
          git add book_state.json || true
          git commit -m "Update book state [skip ci]" || echo "No changes to commit"
          git push || echo "Nothing to push"
